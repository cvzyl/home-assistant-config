#                 RS232                     UART-TTL
#                              ┌──────────┐                ┌─────────┐
# ┌─────────────┐              │          │<----- RX ----->│         │
# │           D-│<---- TX ---->│  RS232   │<----- TX ----->│ ESP32/  │
# │ USB-Plug  D+│<---- RX ---->│  to TTL  │<----- GND ---->│ ESP8266 │
# │          GND│<---- GND --->│  module  │<-- 3.3V VCC -->│         │<--- VCC
# └─────────────┘              │          │                │         │<--- GND
#                              └──────────┘                └─────────┘
#

substitutions:
  name: "esphome-inverter-node"
  friendly_name: Inverter Node

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2024.6.0
  project:
    name: esphome.web
    version: '1.0'

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption: 
    key: !secret generic_encryption_key

# Allow Over-The-Air updates
ota:
  - platform: esphome

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

dashboard_import:
  package_import_url: github://esphome/example-configs/esphome-web/esp8266.yaml@main
  import_full_config: true

# To have a "next url" for improv serial
web_server:
  port: 80

uart:
  - id: uart_0
    tx_pin: GPIO4
    rx_pin: GPIO5
    baud_rate: 9600
    debug:
      direction: BOTH

modbus:
  - uart_id: uart_0
    id: modbus0

modbus_controller:
  - id: inverter0
    address: 0x1
    modbus_id: modbus0
    command_throttle: 200ms
    setup_priority: -10
    update_interval: 10s

